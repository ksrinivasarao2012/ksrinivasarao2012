<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="60%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <style>
      .node { fill: #38bdf8; }
      .node2 { fill: #a78bfa; }
      .edge { stroke: #38bdf8; stroke-opacity: 0.25; stroke-width: 1.2; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d1 { animation-delay: 0.4s; } .d2 { animation-delay: 0.9s; } .d3 { animation-delay: 1.4s; }
      .d4 { animation-delay: 1.9s; } .d5 { animation-delay: 2.4s; }
      @keyframes pulse { 0%,100% { opacity: 0.45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.5); } }
      .flow { stroke-dasharray: 6 10; animation: flow 4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -64; } }
      .name { font: 700 52px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .role { font: 500 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: url(#accent); }
      .tag  { font: 400 16px 'Consolas', 'Courier New', monospace; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <!-- agent network -->
  <g>
    <line class="edge" x1="820" y1="80"  x2="930" y2="140"/>
    <line class="edge" x1="930" y1="140" x2="1050" y2="90"/>
    <line class="edge" x1="930" y1="140" x2="900" y2="230"/>
    <line class="edge" x1="900" y1="230" x2="1020" y2="210"/>
    <line class="edge" x1="1050" y1="90" x2="1020" y2="210"/>
    <line class="edge" x1="820" y1="80"  x2="760" y2="190"/>
    <line class="edge" x1="760" y1="190" x2="900" y2="230"/>
    <line class="edge" x1="1050" y1="90" x2="1130" y2="160"/>
    <line class="edge" x1="1020" y1="210" x2="1130" y2="160"/>
    <path class="edge flow" d="M760 190 L930 140 L1130 160" fill="none" stroke-opacity="0.7" stroke="#a78bfa"/>
    <circle class="node pulse"     cx="820"  cy="80"  r="6"/>
    <circle class="node2 pulse d1" cx="930"  cy="140" r="8"/>
    <circle class="node pulse d2"  cx="1050" cy="90"  r="6"/>
    <circle class="node pulse d3"  cx="900"  cy="230" r="6"/>
    <circle class="node2 pulse d4" cx="1020" cy="210" r="7"/>
    <circle class="node pulse d5"  cx="760"  cy="190" r="5"/>
    <circle class="node2 pulse d2" cx="1130" cy="160" r="5"/>
  </g>

  <!-- text -->
  <text x="70" y="120" class="name">Kommana Srinivasa Rao</text>
  <rect x="70" y="138" width="90" height="4" rx="2" fill="url(#accent)"/>
  <text x="70" y="182" class="role">LLM Agents · RAG · Multi-Agent RL</text>
  <text x="70" y="226" class="tag">&gt; B.Tech AI &amp; Data Science @ IIIT Sri City</text>
</svg>
